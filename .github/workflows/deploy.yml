# 部署到 GitHub Pages（自訂網域 folk.tw）
# - push 到 main 時建置部署
# - 每日 16:00 UTC（＝台灣 00:00）重建，推進「今日選讀」每日一籤（§0.5 / C.8 UTC+8）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * *' # 台灣午夜，更新今日中樞
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的（讓排程重建完成）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 🔴 沒有 timeout 的 job 會一路掛到 GitHub 的 6 小時上限才被強制中止，期間線上停在舊版且無告警。
    # （2026-08-18 實例：run 32164545310 卡在下方 apt 安裝步驟，掛滿 6 小時才被強制 cancelled、
    #  deploy 被 skip，全程零通知——因為 cancelled 不觸發 notify-failure 的 if: failure()，那條一併修了。）
    #
    # 數字依據＝2026-08-18 統計最近 10 次**成功** run 的 build job 實際執行時間（不含排隊）：
    #   12m12s / 15m32s / 15m36s / 15m56s / 19m23s / 19m31s / 19m47s / 20m01s / 20m05s / 22m19s
    #   → 最大 22m19s，取約 1.5 倍 ≈ 35 分鐘，替日後廟數成長（OG 卡張數隨廟數線性增加）留餘裕。
    # ⚠️ 改這個值前先重跑一次上面那個統計，不要憑感覺調。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 廟宇分享卡（postbuild 產 7,891 張 PNG）用 SVG→sharp 光柵化，中文靠系統字型。
      # runner 沒有 CJK 字型時，卡面會整片變成空框（且檔案照樣產出、不會報錯）→ 明確安裝。
      # 產生器本身另有 fc-match 前置檢查，缺字型會直接失敗而不是默默出空框。
      - name: 安裝中文字型（分享卡光柵化用）
        # 🔴 真正的修法是「單次 apt 呼叫不可能無限等待」，step timeout 只是最後一道網。
        #    2026-08-18 這一步對 mirror 的連線無限等待，拖垮整個部署 6 小時。
        # 數字依據＝最近 10 次成功 run 本步驟耗時：10s/11s/11s/11s/12s/15s/17s/35s/36s/2m23s
        #   → 單次 apt 呼叫給 120s（已是那個 2m23s 離群值整步耗時的量級），連三次失敗才放棄；
        #     step 上限 12 分鐘 ≒ 三輪重試的最壞情況，純粹當兜底。
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # 產生器實際要的是 fc-match 找得到「Noto Serif CJK TC」（見 scripts/lib/og-card.mjs）。
          # ① 已經有就直接跳過——runner 映像本來就可能帶 CJK 字型，白跑 apt 只是多一個失敗點。
          if fc-match -f '%{family}' 'Noto Serif CJK TC' 2>/dev/null | grep -qiE 'noto.*(cjk|serif tc)'; then
            echo "runner 已有 CJK 字型，略過安裝：$(fc-match -f '%{family}' 'Noto Serif CJK TC')"
            exit 0
          fi
          # ② apt：偶發卡在 mirror 連線，每次呼叫都限時，避免單次暫時性故障變成無限等待。
          for i in 1 2 3; do
            if sudo timeout 120 apt-get update -qq \
               && sudo timeout 120 apt-get install -y -qq fonts-noto-cjk; then
              echo "字型安裝成功（apt 第 $i 次嘗試）"
              exit 0
            fi
            echo "::warning::apt 第 $i 次失敗，5 秒後重試"
            sleep 5
          done
          # ③ 🔴 apt 失敗不等於沒救：2026-08-19 連兩次部署都掛在這一步（每次都跑滿 120s 逾時
          #    ＝ mirror 連不上），把整批新頁擋在線下。Ubuntu mirror 對 runner 的可用性不是
          #    我們能控制的，但字型檔本身可以從 GitHub 直接抓——那條路與 actions 同源、可靠得多。
          #    Noto 是 SIL OFL 授權，可自由散布。
          echo "::warning::apt 三次皆失敗，改由 GitHub 直接取字型檔"
          #    ⚠️ Regular 與 Bold 都要抓：卡面同時用到兩種字重（見 gen-og-temples.mjs 的
          #    .nm/.act 是 700、.sub/.lbl 是一般），只裝 Bold 會讓整張卡變粗體。
          mkdir -p "$HOME/.local/share/fonts"
          base='https://github.com/notofonts/noto-cjk/raw/main/Serif/OTF/TraditionalChinese'
          ok=1
          for w in Regular Bold; do
            curl -fsSL --retry 3 --retry-delay 3 --max-time 240 \
              -o "$HOME/.local/share/fonts/NotoSerifCJKtc-$w.otf" \
              "$base/NotoSerifCJKtc-$w.otf" || ok=0
          done
          if [ "$ok" = 1 ]; then
            fc-cache -f >/dev/null
            if fc-match -f '%{family}' 'Noto Serif CJK TC' 2>/dev/null | grep -qiE 'noto.*(cjk|serif tc)'; then
              echo "字型改由 GitHub 取得並註冊成功：$(fc-match -f '%{family}' 'Noto Serif CJK TC')"
              exit 0
            fi
          fi
          echo "::error::apt 與直接下載皆失敗，中止部署（缺 CJK 字型會讓分享卡整片空框）"
          exit 1
      # 🔴 gate 清單**不寫在這個 workflow 裡**：唯一真實來源是 scripts/lib/gates.mjs。
      #    以前 deploy.yml／.githooks/pre-push／CLAUDE.md §3／scripts/check-changed.sh
      #    各手抄一份，四份互相矛盾且沒有任何東西會發現矛盾（2026-08-19 收斂）。
      #    要加／減 gate，改 manifest；這裡不動。
      #
      # ⚠️ 這兩步刻意用 `for` 迴圈而非一 gate 一 step：
      #    `set -euo pipefail` ＋ 直接呼叫 `pnpm "$g"`（**不接 pipe**）＝ 任何一道失敗
      #    立刻中止整個 step、exit code 原樣傳出。本 repo 明列過 `cmd | tail && …`
      #    會吃掉 exit code 的坑，這裡絕不引入。::group:: 讓 log 仍逐道可摺疊。
      #
      # 註：check:design／check:content／check:outbound-urls／check:release／check:discover 等
      #    已內建在 `pnpm build`／`postbuild` 的指令鏈裡（manifest 標 viaBuild），
      #    這裡不重複跑；它們沒有被弄丟，跑 `node scripts/lib/gates.mjs table` 可核對。
      - name: 來源層 gate（build 前，讀 scripts/lib/gates.mjs）
        run: |
          set -euo pipefail
          gates="$(node scripts/lib/gates.mjs list ci-pre-build)"
          [ -n "$gates" ] || { echo "::error::gate manifest 回了空清單"; exit 1; }
          for g in $gates; do
            echo "::group::$g"
            pnpm "$g"
            echo "::endgroup::"
          done
      - name: 完整發佈建置（static）
        run: pnpm build:release
      # 產物層 gate：這幾道走訪 dist/**/*.html，**只能**排在 build:release 之後
      # （dist/ 在 .gitignore，build 前跑等於掃舊產物空過或直接拋錯）。
      # 內含 canonical（內部網址非斜線→301）、錨文字（<a> 可見文字不得是裸露網址，
      # 2026-08-04 用戶指出，實測影響 131 頁）、render 不變量（廟頁求籤區塊＋鄉鎮頁摘要）。
      - name: 產物層 gate（build 後，讀 scripts/lib/gates.mjs）
        run: |
          set -euo pipefail
          gates="$(node scripts/lib/gates.mjs list ci-post-build)"
          [ -n "$gates" ] || { echo "::error::gate manifest 回了空清單"; exit 1; }
          for g in $gates; do
            echo "::group::$g"
            pnpm "$g"
            echo "::endgroup::"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 依據＝最近 10 次成功 run 的 deploy job 耗時：11s/11s/24s/26s/31s/31s/42s/1m46s/2m16s
    #   → 最大 2m16s；Pages 偶有慢的時候，取寬鬆的 10 分鐘（仍遠早於 6 小時上限）。
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 上線後把 sitemap URL 送 IndexNow（Bing/Yandex/Seznam/Naver 即時收錄；Google 不吃 IndexNow）。
  # 金鑰非機密（本就公開託管於 /<key>.txt），直接寫在 env。
  # 本 job needs: deploy，所以它失敗時部署早已完成、不影響上線——因此**未全數受理就讓它標紅**
  # （2026-07-29 前是無論如何都 exit 0，結果一次送 12,005 筆撞 IndexNow 的 10,000 上限、
  # 回 400 整批被拒，run 卻顯示 success，要翻 log 才發現沒送出去）。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    # 依據＝最近 10 次成功 run 的 indexnow job 耗時：7s/8s/8s/8s/11s/11s/12s/12s/14s/18s
    #   → 最大 18s；取 5 分鐘。
    timeout-minutes: 5
    env:
      SITE_URL: https://folk.tw
      INDEXNOW_KEY: 70b5e40d2e314f4a126b322cc2bd0672
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Submit this month’s verified annual URLs to IndexNow
        run: |
          node scripts/annual-release-due.mjs --out /tmp/annual-release-urls.txt
          if [ ! -s /tmp/annual-release-urls.txt ]; then
            echo '本月沒有已核對且到期的年度 URL；不送全站 sitemap，避免一次灌入大量網址。'
            exit 0
          fi
          node scripts/indexnow-submit.mjs --from /tmp/annual-release-urls.txt

  # 守門擋下／部署失敗 → Slack 告警（團隊統一模板 2026-07-20）。
  # secrets（SLACK_BOT_TOKEN / SLACK_CHANNEL_ID）未設定時自動靜默略過。
  notify-failure:
    needs: [build, deploy]
    # 🔴 這裡原本只有 failure()，而**逾時／被取消算 cancelled、不算 failure** →
    #    2026-08-18 run 32164545310 卡死 6 小時、deploy 被 skip，卻一封告警都沒發出去。
    #    加上 timeout-minutes 之後，逾時中止走的正是 cancelled 這條路，所以這行非補不可，
    #    否則新加的 timeout 只會讓它「早點安靜地死」，一樣沒人知道。
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 區分兩種死法：被 gate 擋下（要改碼）vs 逾時／被取消（多半是 runner 暫時性故障，重跑即可）。
          # 混為一談會讓人拿錯處方——2026-08-18 那次若照舊文案會被讀成「守門擋下」而去找不存在的違規。
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            TEXT="⏱️ ${{ github.repository }} 部署逾時或被取消（commit ${GITHUB_SHA::7}），**線上仍停在舊版**。不是守門擋下，通常是 runner 暫時性故障；確認後重跑即可。詳情： $RUN_URL"
          else
            TEXT="🚨 ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          fi
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
